<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var m = location.pathname.match(/^(.*\/experiments)\/([^/]+)\/?$/);
        if (m) {
          var prefix = m[1].replace(/\/experiments$/, "");
          location.replace(prefix + "/experiment.html?slug=" + encodeURIComponent(m[2]));
        } else {
          location.replace("../experiment.html");
        }
      })();
    </script>
  </head>
  <body></body>
</html>
